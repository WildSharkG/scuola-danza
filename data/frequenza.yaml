# Quante volte a settimana viene svolto ogni corso.
# Per aggiungere/togliere un corso, aggiungi o rimuovi una voce sotto.
#
# Campi:
#   nome      - testo, obbligatorio (nome del corso, con eventuale fascia d'età tra parentesi)
#   volte     - numero di lezioni a settimana. Facoltativo: omettilo (o cancella
#               la riga) per un corso di cui non si indica la frequenza.
#   ordine    - numero: più basso = più in alto nell'elenco
#   visibile  - true per mostrarlo, false per nasconderlo senza cancellarlo

- nome: "Danzatricità"
  volte: 1
  ordine: 1
  visibile: true

- nome: "Piccoli esploratori (3 anni)"
