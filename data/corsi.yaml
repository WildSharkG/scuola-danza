# Elenco corsi "principali" (bambini/ragazzi + corsi per tutti).
# I corsi di DanzatricitÃ  hanno una loro collection separata: data/danzatricita.yaml
#
# Campi:
#   nome        - testo, obbligatorio
#   gruppo      - "bambini-ragazzi" oppure "tutti" (decide sotto quale titolo appare)
#   eta         - testo libero, facoltativo (es. "Dai 5 anni"). Lascia "" se non serve.
#   descrizione - testo libero, facoltativo, una riga breve.
#   ordine      - numero: più basso = più in alto nell'elenco
#   visibile    - true per mostrarlo, false per nasconderlo senza cancellarlo

- nome: "Piccoli esploratori"
  gruppo: "bambini-ragazzi"
  eta: "Dai 3 anni"
