<header class="site-header" id="site-header">
  <div class="site-header__inner">
    <a href="#" class="brand" aria-label="Torna in cima alla pagina">
      <img src="{{ "img/logo-mark.png" | relURL }}" alt="" class="brand__mark" width="28" height="28">
      <span class="brand__text">A un passo dal sogno</span>
    </a>

    <nav class="nav nav--desktop" aria-label="Navigazione principale">
      {{ range partial "sezioni-attive.html" . }}
        <a href="#{{ .Params.tipo }}" class="nav__link">{{ .Params.nav_label }}</a>
      {{ end }}
    </nav>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-mobile" aria-label="Apri il menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="nav nav--mobile" id="nav-mobile" aria-label="Navigazione principale (mobile)">
    {{ range partial "sezioni-attive.html" . }}
      <a href="#{{ .Params.tipo }}" class="nav__link nav__link--mobile">{{ .Params.nav_label }}</a>
    {{ end }}
  </nav>
</header>
