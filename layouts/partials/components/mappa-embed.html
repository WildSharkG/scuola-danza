<div class="mappa-card" data-reveal>
  <iframe src="{{ hugo.Data.contatti.mappa_embed_src }}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mappa della sede"></iframe>
  <div class="mappa-card__footer">
    <div class="mappa-card__indirizzo">{{ hugo.Data.contatti.indirizzo }}</div>
    {{ with hugo.Data.contatti.video_indicazioni }}
    <a href="{{ . }}" class="mappa-card__video-link" target="_blank" rel="noopener">Come arrivare (video su Instagram) &rarr;</a>
    {{ end }}
  </div>
</div>
