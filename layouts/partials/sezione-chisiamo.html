<section class="section section--alt" id="chisiamo">
  <div class="section__inner">
    {{ partial "section-header.html" . }}
    {{ $c := hugo.Data.contatori }}
    <div class="contatori-row" data-reveal data-counters>
      <div class="contatore">
        <div class="contatore__numero" data-count-target="{{ $c.anni_esperienza }}" data-count-suffix="+">0</div>
        <div class="contatore__etichetta">ANNI DI ESPERIENZA</div>
      </div>
      <div class="contatore">
        <div class="contatore__numero" data-count-target="{{ $c.rinnovo_iscrizioni }}" data-count-suffix="%">0</div>
        <div class="contatore__etichetta">RINNOVO ISCRIZIONI</div>
      </div>
      <div class="contatore">
        <div class="contatore__numero" data-count-target="{{ $c.allievi_felici }}" data-count-suffix="%">0</div>
        <div class="contatore__etichetta">ALLIEVI FELICI</div>
      </div>
    </div>
  </div>
</section>
