<section class="section section--alt" id="corsi">
  <div class="section__inner">
    {{ partial "section-header.html" . }}

    {{ $corsi := sort (where hugo.Data.corsi "visibile" true) "ordine" }}
    <div class="corsi-grid" data-reveal>
      {{ range $corsi }}{{ partial "components/corso-card.html" . }}{{ end }}
    </div>
  </div>
</section>
