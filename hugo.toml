# Sostituisci "TUO-UTENTE" col nome utente/organizzazione GitHub reale.
# Se il repository si chiama esattamente "TUO-UTENTE.github.io", il sito
# è servito alla radice: usa "https://TUO-UTENTE.github.io/" invece
# (vedi docs/DEPLOYMENT-GITHUB.md Parte A.2).
baseURL = "https://wildsharkg.github.io/scuola-danza/"
locale = "it_IT"
title = "A un passo dal sogno"

# Sito one-page: niente RSS/sitemap/robots, non servono per una singola pagina statica.
disableKinds = ["RSS", "sitemap", "taxonomy", "term", "404"]

# Nessun analytics/tracker per scelta di progetto: restiamo leggeri e senza cookie banner.
[services]
  [services.googleAnalytics]
    ID = ""

[params]
  descrizione = "Scuola di danza classica, danza moderna, danzatricità e pilates per bambini e adulti."
